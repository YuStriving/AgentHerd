name: Sync AgentHerd upstream

on:
  schedule:
    - cron: '17 */2 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: agentherd-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'YuStriving/AgentHerd' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Merge upstream main into the fork
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/YuStriving/AgentHerd/merge-upstream -f branch=main
